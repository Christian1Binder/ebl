name: Prüfen & veröffentlichen
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ebl-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ebl
          MYSQL_ROOT_PASSWORD: ebl-ci-only-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pebl-ci-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      EBL_DB_HOST: 127.0.0.1
      EBL_DB_USER: root
      EBL_DB_PASSWORD: ebl-ci-only-password
      EBL_DB_NAME: ebl
      EBL_LOCAL_HTTP: '1'
      EBL_ADMIN_PASSWORD: ebl-ci-admin-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Datenmodell und Frontend prüfen
        run: npm run check && npm test
      - name: PHP prüfen
        run: find api database -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Testdatenbank einrichten
        run: |
          cp api/config.example.php api/config.local.php
          php database/install.php --name="CI Admin" --email="admin@example.test"
      - name: API, Rollen und private Daten testen
        run: |
          php -S 127.0.0.1:8080 -t . > /tmp/ebl-php.log 2>&1 &
          node tests/api.mjs
      - name: Browserprüfungen installieren
        run: npm install --no-save --package-lock=false playwright@1.58.2 && npx playwright install --with-deps chromium
      - name: Lernabläufe und mobile Ansicht testen
        run: node tests/browser.mjs
      - name: Ansichten für visuelle Kontrolle sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ebl-ansichten
          path: test-results/
          if-no-files-found: ignore
      - name: Veröffentlichungspaket zusammenstellen
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -r assets js data _site/
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5
      - name: Lernplattform veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Veröffentlichte Dateien kontrollieren
        env:
          EBL_LIVE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node tests/live.mjs
